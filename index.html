<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Weather Explorer</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config = {
  theme: {
    extend: {
      fontFamily: { sans: ['"Pretendard Variable"','Pretendard','system-ui','sans-serif'] },
      borderRadius: { panel: '24px', card: '16px' },
      backdropBlur: { panel: '24px', card: '12px', chip: '8px' },
      boxShadow: {
        panel: '0 8px 32px rgba(0,0,0,0.24)',
        card:  '0 4px 16px rgba(0,0,0,0.16)',
      },
      colors: {
        accent: '#FBBF24',
        danger: '#FB7185',
        ink:  { 1:'var(--ink-primary)', 2:'var(--ink-secondary)', 3:'var(--ink-tertiary)' },
      },
      transitionTimingFunction: { panel: 'cubic-bezier(0.32,0.72,0,1)' },
    }
  }
}
</script>
<style>
  :root{ font-feature-settings: "tnum" 1; }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family:"Pretendard Variable",Pretendard,-apple-system,system-ui,sans-serif;
    background: var(--bg-to);
    color: var(--ink-primary);
  }

  /* ---------- Theme tokens (DESIGN.md 3.1 / 3.2) ---------- */
  body[data-theme="clear-day"]{ --bg-from:#38BDF8; --bg-to:#FDE68A; --ink-primary:#0F172A; --ink-secondary:rgba(15,23,42,.72); --ink-tertiary:rgba(15,23,42,.52); --scrim:rgba(255,255,255,.32); --scrim-strong:rgba(255,255,255,.72); --glass-l1:rgba(255,255,255,.38); --glass-l2:rgba(255,255,255,.30); --glass-l3:rgba(255,255,255,.34); }
  body[data-theme="clear-night"]{ --bg-from:#1E3A8A; --bg-to:#0B1026; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }
  body[data-theme="cloudy-day"]{ --bg-from:#5B8FB9; --bg-to:#C7D5E0; --ink-primary:#0F172A; --ink-secondary:rgba(15,23,42,.72); --ink-tertiary:rgba(15,23,42,.52); --scrim:rgba(255,255,255,.32); --scrim-strong:rgba(255,255,255,.72); --glass-l1:rgba(255,255,255,.38); --glass-l2:rgba(255,255,255,.30); --glass-l3:rgba(255,255,255,.34); }
  body[data-theme="cloudy-night"]{ --bg-from:#1F2937; --bg-to:#030712; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }
  body[data-theme="fog-day"]{ --bg-from:#8FA3B0; --bg-to:#DDE4E9; --ink-primary:#0F172A; --ink-secondary:rgba(15,23,42,.72); --ink-tertiary:rgba(15,23,42,.52); --scrim:rgba(255,255,255,.32); --scrim-strong:rgba(255,255,255,.72); --glass-l1:rgba(255,255,255,.38); --glass-l2:rgba(255,255,255,.30); --glass-l3:rgba(255,255,255,.34); }
  body[data-theme="fog-night"]{ --bg-from:#334155; --bg-to:#0F172A; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }
  body[data-theme="rain-day"]{ --bg-from:#1D4ED8; --bg-to:#0E7490; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }
  body[data-theme="rain-night"]{ --bg-from:#0C2340; --bg-to:#020617; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }
  body[data-theme="snow-day"]{ --bg-from:#A5D8FF; --bg-to:#F8FAFC; --ink-primary:#0F172A; --ink-secondary:rgba(15,23,42,.72); --ink-tertiary:rgba(15,23,42,.52); --scrim:rgba(255,255,255,.32); --scrim-strong:rgba(255,255,255,.72); --glass-l1:rgba(255,255,255,.38); --glass-l2:rgba(255,255,255,.30); --glass-l3:rgba(255,255,255,.34); }
  body[data-theme="snow-night"]{ --bg-from:#1E3A5F; --bg-to:#0B1B2B; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }
  body[data-theme="storm-day"]{ --bg-from:#5B21B6; --bg-to:#1E1B4B; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }
  body[data-theme="storm-night"]{ --bg-from:#1E1B4B; --bg-to:#020617; --ink-primary:#F8FAFC; --ink-secondary:rgba(248,250,252,.78); --ink-tertiary:rgba(248,250,252,.58); --scrim:rgba(0,0,0,.28); --scrim-strong:rgba(0,0,0,.72); --glass-l1:rgba(255,255,255,.14); --glass-l2:rgba(255,255,255,.10); --glass-l3:rgba(255,255,255,.12); }

  #bg-layer{ position:fixed; inset:0; z-index:0; background-image:linear-gradient(160deg, var(--bg-from) 0%, var(--bg-to) 100%); transition:background-image .8s ease-in-out; }

  /* ---------- Glass tiers (DESIGN.md 4.1 / 4.2) ---------- */
  .glass-l1{ backdrop-filter:blur(24px); -webkit-backdrop-filter:blur(24px); background:var(--glass-l1); border:1px solid rgba(255,255,255,.22); box-shadow:0 8px 32px rgba(0,0,0,.24); }
  .glass-l2{ backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); background:var(--glass-l2); border:1px solid rgba(255,255,255,.16); box-shadow:0 4px 16px rgba(0,0,0,.16); }
  .glass-l3{ backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px); background:var(--glass-l3); border:1px solid rgba(255,255,255,.20); }
  .glass-scrim{ position:relative; isolation:isolate; }
  .glass-scrim::before{ content:""; position:absolute; inset:0; z-index:-1; border-radius:inherit; background:var(--scrim); }
  @supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){
    .glass-scrim::before{ background:var(--scrim-strong); }
  }

  .text-ink-1{ color:var(--ink-primary); }
  .text-ink-2{ color:var(--ink-secondary); }
  .text-ink-3{ color:var(--ink-tertiary); }

  /* ---------- Scene ---------- */
  #scene-wrapper{ position:relative; }
  #scene-svg{ display:block; width:100%; height:auto; }
  .landmark{ cursor:pointer; outline:none; }
  .landmark .silhouette{ fill:url(#glassFill); stroke:rgba(255,255,255,.55); stroke-width:2; transition:stroke .16s ease-out, opacity .3s ease; filter:drop-shadow(0 -1px .4px rgba(255,255,255,.35)); }
  .landmark:hover .silhouette, .landmark:focus-visible .silhouette{ stroke:rgba(255,255,255,.9); }
  .landmark.selected .silhouette{ stroke:#FBBF24; stroke-width:2.5; }
  .landmark .hit-area{ fill:transparent; }
  .landmark .label{ opacity:0; transition:opacity .16s ease-out; fill:#fff; paint-order:stroke; stroke:#0f172a; stroke-width:4px; font-size:20px; font-weight:600; }
  .landmark:hover .label, .landmark:focus-visible .label{ opacity:1; }
  .focus-ring{ opacity:0; fill:none; stroke:#FBBF24; stroke-width:3; stroke-dasharray:4 3; }
  .landmark:focus-visible .focus-ring{ opacity:1; }
  .landmark.filtered-out{ opacity:.2; filter:grayscale(1); pointer-events:none; }

  .badge-content{ opacity:0; transform:translateY(4px); transition:opacity .32s ease-out, transform .32s ease-out; }
  .badge-content.ready{ opacity:1; transform:translateY(0); }
  .badge-pill{ fill:var(--glass-l3); stroke:rgba(255,255,255,.20); stroke-width:1; }
  .badge-emoji{ font-size:14px; }
  .badge-temp{ font-size:12px; font-weight:600; fill:#fff; paint-order:stroke; stroke:#0f172a; stroke-width:3px; }
  .badge-skeleton rect{ fill:rgba(255,255,255,.2); }
  .skeleton-pulse{ animation:pulse 1.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.16; } 50%{ opacity:.28; } }

  #night-overlay{ fill:#050914; transition:opacity 1.2s ease-in-out; pointer-events:none; }

  @media (max-width:767px){
    #scene-wrapper{ overflow-x:auto; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
    #scene-svg{ width:1600px; max-width:none; }
    .landmark .label{ display:none; }
    .scroll-hint{ display:flex; }
  }
  @media (min-width:768px){ .scroll-hint{ display:none; } }

  /* ---------- Detail panel ---------- */
  #detail-panel{ position:fixed; z-index:50; color:var(--ink-primary); transition:transform .32s cubic-bezier(0.32,0.72,0,1); }
  @media (min-width:768px){
    #detail-panel{ top:24px; right:24px; bottom:24px; width:440px; border-radius:24px; transform:translateX(calc(100% + 24px)); }
    #detail-panel.open{ transform:translateX(0); }
  }
  @media (max-width:767px){
    #detail-panel{ left:0; right:0; bottom:0; height:85vh; border-radius:24px 24px 0 0; transform:translateY(100%); }
    #detail-panel.open{ transform:translateY(0); }
  }
  #panel-backdrop{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .3s ease; }
  #panel-backdrop.open{ opacity:1; pointer-events:auto; }
  #drag-handle{ width:40px; height:4px; border-radius:999px; background:rgba(255,255,255,.4); margin:10px auto 0; }

  /* ---------- Chips ---------- */
  .chip{ height:32px; padding:0 14px; font-size:12px; font-weight:600; border-radius:9999px; transition:background-color .12s ease-out,color .12s ease-out; color:var(--ink-primary); white-space:nowrap; display:inline-flex; align-items:center; gap:4px; }
  .chip[aria-pressed="true"]{ background:#FBBF24 !important; color:#0F172A !important; border-color:transparent; }
  .chip-x{ display:none; font-size:12px; }
  .chip[aria-pressed="true"] .chip-x{ display:inline; }
  .chip:disabled{ opacity:.4; cursor:not-allowed; }

  .skel-block{ background:rgba(255,255,255,.16); animation:pulse 1.6s ease-in-out infinite; }

  .forecast-card{ scroll-snap-align:start; width:88px; height:148px; flex-shrink:0; }
  #forecast-scroll{ scroll-snap-type:x proximity; }

  @media (prefers-reduced-motion:reduce){
    *{ animation-duration:.01ms !important; animation-iteration-count:1 !important; transition-duration:.01ms !important; }
    .skeleton-pulse, .skel-block{ animation:none !important; opacity:.20 !important; }
  }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(148,163,184,.5); border-radius:4px; }
  input::placeholder{ color:var(--ink-tertiary); }
</style>
</head>
<body data-theme="clear-day">

<div id="bg-layer" aria-hidden="true"></div>

<div id="app" class="relative z-10 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-30 h-14 md:h-16 flex items-center px-4 md:px-6 glass-l1 glass-scrim">
    <div class="flex items-center gap-3 flex-wrap w-full">
      <h1 class="text-[16px] md:text-[18px] font-bold tracking-[-0.01em] whitespace-nowrap text-ink-1">World Weather Explorer</h1>

      <div class="relative flex-1 min-w-[160px] max-w-md">
        <span class="absolute left-3.5 top-1/2 -translate-y-1/2 text-[16px] pointer-events-none">🔍</span>
        <input id="search-input" type="text" autocomplete="off"
          role="combobox" aria-expanded="false" aria-controls="search-dropdown" aria-autocomplete="list"
          placeholder="도시 검색 (예: 파리, Tokyo)"
          class="w-full h-11 rounded-card pl-10 pr-4 text-[15px] glass-l1 text-ink-1 outline-none focus:ring-2 focus:ring-accent" />
        <div id="search-dropdown" role="listbox" aria-label="검색 결과"
          class="hidden absolute left-0 right-0 top-full mt-2 z-40 glass-l1 glass-scrim rounded-card overflow-hidden max-h-80 overflow-y-auto"></div>
      </div>

      <button id="filter-toggle-btn" class="md:hidden relative h-11 px-4 rounded-full glass-l3 text-[13px] font-medium text-ink-1">
        필터
        <span id="filter-count-badge" class="hidden absolute -top-1 -right-1 bg-danger text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center"></span>
      </button>
    </div>
  </header>

  <!-- Filter bar -->
  <section id="filter-bar" class="z-20 px-4 md:px-6 py-3 md:py-4 hidden md:block">
    <div class="flex flex-col gap-2.5 md:flex-row md:items-center md:gap-6 md:flex-wrap">
      <div class="flex items-center gap-2 overflow-x-auto md:overflow-visible pb-1 md:pb-0">
        <span class="shrink-0 text-[13px] text-ink-3">날씨</span>
        <div class="flex gap-2 shrink-0" data-axis="weather" role="group" aria-label="날씨 상태 필터"></div>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto md:overflow-visible pb-1 md:pb-0">
        <span class="shrink-0 text-[13px] text-ink-3">지역</span>
        <div class="flex gap-2 shrink-0" data-axis="region" role="group" aria-label="지역 필터"></div>
      </div>
      <div class="flex items-center gap-2 overflow-x-auto md:overflow-visible pb-1 md:pb-0">
        <span class="shrink-0 text-[13px] text-ink-3">낮/밤</span>
        <div class="flex gap-2 shrink-0" data-axis="daynight" role="group" aria-label="낮/밤 필터"></div>
      </div>
      <div class="flex items-center gap-3 md:ml-auto">
        <span id="filter-counter" class="text-[13px] font-medium text-ink-1 whitespace-nowrap">12곳 중 12곳</span>
        <button id="clear-filters-btn" class="text-[13px] underline text-ink-2 whitespace-nowrap">전체 해제</button>
      </div>
    </div>
    <p id="degraded-banner" class="hidden mt-3 glass-l2 glass-scrim rounded-card px-4 py-3 text-[13px] text-ink-1 flex items-center gap-3 flex-wrap">
      날씨 정보를 불러오지 못해 필터를 사용할 수 없습니다
      <button id="retry-prefetch-btn" class="underline font-medium text-accent">재시도</button>
    </p>
  </section>

  <!-- Main scene -->
  <main class="relative flex-1 flex items-center">
    <div id="scene-wrapper" class="w-full relative">
      <svg id="scene-svg" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" aria-label="세계 랜드마크 일러스트 씬">
        <defs>
          <linearGradient id="glassFill" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#fff" stop-opacity="0.22"/>
            <stop offset="100%" stop-color="#fff" stop-opacity="0.08"/>
          </linearGradient>
        </defs>

        <!-- background mountains -->
        <path d="M0,480 L120,380 L260,460 L420,340 L600,470 L760,360 L940,450 L1120,370 L1300,460 L1440,390 L1600,470 L1600,600 L0,600 Z" fill="var(--mountain-fill,#3a4656)" opacity="0.35"></path>

        <g id="landmarks-layer"></g>

        <!-- foreground ground -->
        <path d="M0,520 Q400,505 800,520 T1600,520 L1600,600 L0,600 Z" fill="var(--ground-fill,#1b2531)"></path>

        <rect id="night-overlay" x="0" y="0" width="1600" height="600" opacity="0"></rect>
      </svg>

      <div class="scroll-hint pointer-events-none absolute right-0 top-0 bottom-0 w-16 items-center justify-end pr-2"
        style="background:linear-gradient(to right, transparent, rgba(0,0,0,.25));">
        <span class="text-white text-2xl">›</span>
      </div>

      <!-- empty filter overlay -->
      <div id="empty-filter-overlay" class="hidden absolute inset-0 z-20 flex items-center justify-center px-4">
        <div class="glass-l1 glass-scrim rounded-panel px-6 py-6 text-center text-ink-1">
          <p class="text-[15px] font-semibold mb-4">조건에 맞는 곳이 없습니다</p>
          <button id="empty-filter-reset-btn" class="h-10 px-5 rounded-full bg-accent text-[#0F172A] text-[13px] font-semibold">필터 초기화</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Detail panel backdrop -->
<div id="panel-backdrop"></div>

<!-- Detail panel -->
<aside id="detail-panel" class="glass-l1 glass-scrim" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
  <div id="drag-handle" class="md:hidden"></div>
  <div class="h-full flex flex-col p-5 md:p-6 overflow-y-auto">
    <div class="flex items-start justify-between mb-5 md:mb-6">
      <div>
        <h2 id="panel-title" class="text-[24px] md:text-[28px] font-semibold leading-tight tracking-[-0.02em] text-ink-1"></h2>
        <p id="panel-subtitle" class="text-[13px] text-ink-3 mt-1"></p>
      </div>
      <button id="panel-close-btn" aria-label="닫기" class="text-2xl leading-none w-11 h-11 flex items-center justify-center rounded-full hover:bg-white/10 text-ink-1">×</button>
    </div>

    <!-- loading skeleton -->
    <div id="panel-skeleton" class="hidden space-y-4">
      <div class="skel-block h-5 w-32 rounded-card"></div>
      <div class="skel-block h-20 w-full rounded-card"></div>
      <div class="skel-block h-28 w-full rounded-card"></div>
      <div class="skel-block h-36 w-full rounded-card"></div>
    </div>

    <!-- error -->
    <div id="panel-error" class="hidden flex flex-col items-center text-center py-8">
      <span class="text-[40px] mb-3">⚠️</span>
      <p id="panel-error-message" class="text-[15px] text-ink-1 mb-4"></p>
      <div class="flex gap-2">
        <button id="panel-retry-btn" class="h-10 px-4 rounded-card glass-l2 border border-danger text-[13px] font-medium text-ink-1">재시도</button>
        <button id="panel-error-close-btn" class="h-10 px-4 rounded-card glass-l2 text-[13px] text-ink-1">닫기</button>
      </div>
    </div>

    <!-- content -->
    <div id="panel-content" class="hidden flex-1 flex flex-col">
      <p id="panel-time" class="text-[18px] md:text-[20px] font-medium tabular-nums text-ink-1 tracking-[-0.01em]"></p>
      <p id="panel-date" class="text-[13px] text-ink-3 mb-5 md:mb-6"></p>

      <div class="flex items-start gap-4 mb-2">
        <div class="flex items-start">
          <span id="panel-temp-value" class="text-[56px] md:text-[72px] font-bold leading-none tracking-[-0.03em] text-ink-1 tabular-nums">-</span>
          <span id="panel-temp-unit" class="text-[22px] md:text-[29px] font-bold text-ink-1 mt-1">°C</span>
        </div>
        <span id="panel-emoji" class="text-[40px] md:text-[48px] mt-1"></span>
      </div>
      <p id="panel-weather-label" class="text-[15px] text-ink-2 mb-5 md:mb-6"></p>

      <div class="grid grid-cols-2 gap-2.5 mb-6">
        <div class="glass-l2 glass-scrim rounded-card px-4 py-3"><span class="block text-[13px] text-ink-3 mb-0.5">체감</span><span id="panel-feels" class="text-[20px] font-semibold text-ink-1"></span></div>
        <div class="glass-l2 glass-scrim rounded-card px-4 py-3"><span class="block text-[13px] text-ink-3 mb-0.5">습도</span><span id="panel-humidity" class="text-[20px] font-semibold text-ink-1"></span></div>
        <div class="glass-l2 glass-scrim rounded-card px-4 py-3"><span class="block text-[13px] text-ink-3 mb-0.5">강수</span><span id="panel-precip" class="text-[20px] font-semibold text-ink-1"></span></div>
        <div class="glass-l2 glass-scrim rounded-card px-4 py-3"><span class="block text-[13px] text-ink-3 mb-0.5">풍속</span><span id="panel-wind" class="text-[20px] font-semibold text-ink-1"></span></div>
      </div>

      <h3 class="text-[13px] font-medium text-ink-3 mb-2.5">7일 예보</h3>
      <div id="forecast-scroll" class="flex gap-2.5 overflow-x-auto pb-2"></div>
    </div>
  </div>
</aside>

<script>
(function(){
  "use strict";

  var TIMEOUT_MS = 8000;
  var PREFETCH_TTL_MS = 10*60*1000;
  var DETAIL_TTL_MS = 10*60*1000;
  var PREFETCH_CACHE_KEY = 'wwe_prefetch_v1';

  // ---------------- Fetch helpers ----------------
  function fetchJSON(url, opts){
    opts = opts || {};
    return new Promise(function(resolve, reject){
      if(!navigator.onLine){
        reject({kind:'offline', message:'인터넷 연결을 확인해주세요'});
        return;
      }
      var controller = new AbortController();
      var timeoutId = setTimeout(function(){ controller.abort(); }, TIMEOUT_MS);
      if(opts.signal){
        if(opts.signal.aborted) controller.abort();
        else opts.signal.addEventListener('abort', function(){ controller.abort(); });
      }
      fetch(url, {signal: controller.signal}).then(function(res){
        clearTimeout(timeoutId);
        if(res.status === 429){ reject({kind:'rate_limit', message:'요청이 많습니다. 잠시 후 다시 시도해주세요'}); return; }
        if(res.status >= 500){ reject({kind:'server', message:'날씨 정보를 불러오지 못했습니다'}); return; }
        if(!res.ok){ reject({kind:'unknown', message:'알 수 없는 오류가 발생했습니다'}); return; }
        res.json().then(resolve).catch(function(){
          reject({kind:'parse', message:'알 수 없는 오류가 발생했습니다'});
        });
      }).catch(function(err){
        clearTimeout(timeoutId);
        if(err && err.name === 'AbortError'){
          reject({kind:'timeout', message:'날씨 정보를 불러오지 못했습니다'});
        } else {
          reject({kind:'unknown', message:'알 수 없는 오류가 발생했습니다'});
        }
      });
    });
  }

  function geocode(query, signal){
    var url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(query) + '&count=6&language=ko&format=json';
    return fetchJSON(url, {signal: signal}).then(function(data){
      return data.results || [];
    });
  }

  function prefetchScene(){
    try{
      var cached = sessionStorage.getItem(PREFETCH_CACHE_KEY);
      if(cached){
        var parsed = JSON.parse(cached);
        if(Date.now() - parsed.ts < PREFETCH_TTL_MS){
          return Promise.resolve(parsed.data);
        }
      }
    }catch(e){}
    var lats = LANDMARKS.map(function(l){ return l.lat; }).join(',');
    var lons = LANDMARKS.map(function(l){ return l.lon; }).join(',');
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lats + '&longitude=' + lons +
      '&current=temperature_2m,weather_code,is_day&timezone=auto';
    return fetchJSON(url).then(function(data){
      var arr = Array.isArray(data) ? data : [data];
      try{ sessionStorage.setItem(PREFETCH_CACHE_KEY, JSON.stringify({ts:Date.now(), data:arr})); }catch(e){}
      return arr;
    });
  }

  function fetchForecast(lat, lon, signal){
    var key = lat.toFixed(4) + ',' + lon.toFixed(4);
    var cached = forecastCache.get(key);
    if(cached && Date.now() - cached.ts < DETAIL_TTL_MS){
      return Promise.resolve(cached.data);
    }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,wind_speed_10m' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=auto&forecast_days=7';
    return fetchJSON(url, {signal: signal}).then(function(data){
      forecastCache.set(key, {ts:Date.now(), data:data});
      return data;
    });
  }

  // ---------------- URL sync ----------------
  function syncUrl(){
    var parts = [];
    if(state.filters.weather.length) parts.push('w=' + state.filters.weather.join(','));
    if(state.filters.region.length) parts.push('r=' + state.filters.region.map(function(r){ return REGION_CODE[r]; }).join(','));
    if(state.filters.daynight.length) parts.push('d=' + state.filters.daynight.join(','));
    var qs = parts.length ? '?' + parts.join('&') : '';
    history.replaceState(null, '', window.location.pathname + qs);
  }
  function loadFiltersFromUrl(){
    var params = new URLSearchParams(window.location.search);
    var w = params.get('w'), r = params.get('r'), d = params.get('d');
    var validW = WEATHER_AXIS_OPTIONS.map(function(o){ return o.value; });
    if(w) state.filters.weather = w.split(',').filter(function(v){ return validW.indexOf(v) >= 0; });
    if(r) state.filters.region = r.split(',').map(function(c){ return CODE_REGION[c]; }).filter(Boolean);
    if(d) state.filters.daynight = d.split(',').filter(function(v){ return v === 'day' || v === 'night'; });
  }

  // ---------------- Landmark visibility ----------------
  function isLandmarkVisible(l){
    if(!l.weather) return true;
    var info = getWeatherInfo(l.weather.weather_code);
    var dn = l.weather.is_day === 1 ? 'day' : 'night';
    var f = state.filters;
    if(f.weather.length && f.weather.indexOf(info.group) < 0) return false;
    if(f.region.length && f.region.indexOf(l.region) < 0) return false;
    if(f.daynight.length && f.daynight.indexOf(dn) < 0) return false;
    return true;
  }

  sceneSvg.addEventListener('keydown', function(e){
    var current = document.activeElement.closest ? document.activeElement.closest('.landmark') : null;
    var items = Array.prototype.slice.call(document.querySelectorAll('.landmark:not(.filtered-out)'));
    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){
      e.preventDefault();
      if(!items.length) return;
      var idx = items.indexOf(current);
      var next;
      if(idx === -1) next = items[0];
      else next = e.key === 'ArrowRight' ? items[(idx+1) % items.length] : items[(idx-1+items.length) % items.length];
      next.focus();
      return;
    }
    if((e.key === 'Enter' || e.key === ' ') && current && !current.classList.contains('filtered-out')){
      e.preventDefault();
      lastFocusedTrigger = current;
      activateLandmarkById(current.dataset.id);

  function selectPlace(place){
    if(detailAbortController) detailAbortController.abort();

    state.selected = place;
    state.phase = 'DETAIL_LOADING';

    state.error = null;
    closeSearchDropdown();

    openPanel();
    fetchForecast(place.lat, place.lon, detailAbortController.signal).then(function(data){
      state.detail = data;
      state.phase = 'DETAIL_READY';
      render();
      startClockTimer();

    backdropEl.classList.add('open');
    document.addEventListener('keydown', onPanelKeydown);
    setTimeout(function(){ panelEl.focus(); }, 50);
  }
  function closePanel(){
    panelEl.classList.remove('open');
    backdropEl.classList.remove('open');
    document.removeEventListener('keydown', onPanelKeydown);
    if(detailAbortController) detailAbortController.abort();
    if(clockTimerId){ clearInterval(clockTimerId); clockTimerId = null; }
    state.selected = null;
    state.detail = null;
    state.error = null;
    state.phase = (state.phase === 'DETAIL_LOADING' || state.phase === 'DETAIL_READY' || state.phase === 'DETAIL_ERROR')
      ? (hasPrefetchError ? 'SCENE_DEGRADED' : 'SCENE_READY') : state.phase;
    render();
    applyBackground();
    if(lastFocusedTrigger && lastFocusedTrigger.focus) lastFocusedTrigger.focus();
  }
  function onPanelKeydown(e){
    if(e.key === 'Escape'){ e.preventDefault(); closePanel(); return; }
    if(e.key === 'Tab'){
      var focusables = panelEl.querySelectorAll('button, [href], input, [tabindex]:not([tabindex="-1"])');
      if(!focusables.length) return;
      var first = focusables[0], last = focusables[focusables.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }
  }
  document.getElementById('panel-close-btn').addEventListener('click', closePanel);
  document.getElementById('panel-error-close-btn').addEventListener('click', closePanel);
  backdropEl.addEventListener('click', closePanel);
  document.getElementById('panel-retry-btn').addEventListener('click', function(){
    if(state.selected) selectPlace(state.selected);
  });

  // swipe down to close (mobile bottom sheet)
  (function(){
    var startY = null;
    panelEl.addEventListener('touchstart', function(e){ startY = e.touches[0].clientY; }, {passive:true});
    panelEl.addEventListener('touchend', function(e){
      if(startY === null) return;
      var dy = e.changedTouches[0].clientY - startY;
      if(dy > 80) closePanel();
      startY = null;
    }, {passive:true});
  })();

  // ---------------- Clock ----------------
  function startClockTimer(){
    if(clockTimerId) clearInterval(clockTimerId);
    updateClockDisplay();
    clockTimerId = setInterval(updateClockDisplay, 1000);
  }
  function updateClockDisplay(){
    if(!state.detail || typeof state.detail.utc_offset_seconds !== 'number') return;
    var localMs = Date.now() + state.detail.utc_offset_seconds * 1000;
    var d = new Date(localMs);
    var hh = String(d.getUTCHours()).padStart(2, '0');
    var mm = String(d.getUTCMinutes()).padStart(2, '0');
    var timeEl = document.getElementById('panel-time');
    var dateEl = document.getElementById('panel-date');
    if(timeEl) timeEl.textContent = hh + ':' + mm;
    if(dateEl) dateEl.textContent = (d.getUTCMonth()+1) + '월 ' + d.getUTCDate() + '일 ' + WEEKDAY_KO[d.getUTCDay()] + '요일';
  }

  // ---------------- Search ----------------
  var searchInput = document.getElementById('search-input');
  var searchDropdown = document.getElementById('search-dropdown');

  function flagEmoji(cc){
    if(!cc) return '';
    var chars = cc.toUpperCase().split('').map(function(c){ return String.fromCodePoint(127397 + c.charCodeAt(0)); });
    return chars.join('');
  }

  searchInput.addEventListener('input', function(){
    var q = searchInput.value.trim();
    state.searchQuery = q;
    state.searchHighlight = -1;
    if(searchDebounceId) clearTimeout(searchDebounceId);
    if(searchAbortController) searchAbortController.abort();
    if(q.length < 2){
      state.searchPhase = 'idle';
      state.searchResults = [];
      renderSearchDropdown();
      return;
    }
    state.searchPhase = 'loading';
    renderSearchDropdown();
    searchDebounceId = setTimeout(function(){
      searchAbortController = new AbortController();
      geocode(q, searchAbortController.signal).then(function(results){
        state.searchResults = results;
        state.searchPhase = results.length ? 'results' : 'empty';
        state.searchHighlight = results.length ? 0 : -1;
        renderSearchDropdown();
      }).catch(function(err){
        if(err && err.name === 'AbortError') return;
        state.searchResults = [];
        state.searchPhase = 'empty';
        renderSearchDropdown();
      });
    }, 300);
  });

  searchInput.addEventListener('keydown', function(e){
    if(state.searchPhase !== 'results' && e.key !== 'Escape') return;
    var n = state.searchResults.length;
    if(e.key === 'ArrowDown'){ e.preventDefault(); state.searchHighlight = (state.searchHighlight + 1) % n; renderSearchDropdown(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); state.searchHighlight = (state.searchHighlight - 1 + n) % n; renderSearchDropdown(); }
    else if(e.key === 'Enter'){
      if(state.searchHighlight >= 0 && state.searchResults[state.searchHighlight]){
        e.preventDefault();
        chooseSearchResult(state.searchResults[state.searchHighlight]);
      }
    } else if(e.key === 'Escape'){
      closeSearchDropdown();
    }
  });
  searchInput.addEventListener('blur', function(){
    setTimeout(closeSearchDropdown, 150);
  });

  function closeSearchDropdown(){
    state.searchPhase = 'idle';
    state.searchResults = [];
    state.searchHighlight = -1;
    searchDropdown.classList.add('hidden');
    searchInput.setAttribute('aria-expanded', 'false');
  }

  function chooseSearchResult(result){
    var place = {
      id: 'geo-' + result.id,
      name: result.name,
      city: result.name,
      country: result.country || '',
      admin1: result.admin1 || '',
      region: null,
      lat: result.latitude,
      lon: result.longitude,
      isSearchResult: true
    };
    lastFocusedTrigger = searchInput;
    searchInput.value = '';
    closeSearchDropdown();
    selectPlace(place);
  }

  function renderSearchDropdown(){
    if(state.searchPhase === 'idle'){
      searchDropdown.classList.add('hidden');
      searchInput.setAttribute('aria-expanded', 'false');
      return;
    }
    searchDropdown.classList.remove('hidden');
    searchInput.setAttribute('aria-expanded', 'true');
    if(state.searchPhase === 'loading'){
      searchDropdown.innerHTML = '<div class="px-4 py-3 text-[13px] text-ink-3">검색 중…</div>';
      return;
    }
    if(state.searchPhase === 'empty'){
      searchDropdown.innerHTML =
        '<div class="flex flex-col items-center text-center py-8 px-6">' +
          '<span class="text-[40px] mb-3">🔍</span>' +
          '<p class="text-[15px] font-semibold text-ink-1 mb-2">\'' + escapeHtml(state.searchQuery) + '\'에 해당하는 도시를 찾을 수 없습니다</p>' +
          '<ul class="text-[13px] text-ink-3 space-y-0.5">' +
            '<li>철자를 확인해보세요</li>' +
            '<li>영문 이름으로도 검색해보세요</li>' +
            '<li>더 큰 도시명으로 검색해보세요</li>' +
          '</ul>' +
        '</div>';
      return;
    }
    searchDropdown.innerHTML = state.searchResults.map(function(r, i){
      var flag = flagEmoji(r.country_code);
      var active = i === state.searchHighlight;
      return '<div role="option" id="search-opt-' + i + '" aria-selected="' + active + '" data-index="' + i + '" ' +
        'class="h-[52px] px-4 flex items-center gap-2 text-[15px] cursor-pointer text-ink-1" style="background:' + (active ? 'rgba(255,255,255,.16)' : 'transparent') + '">' +
        '<span>' + flag + '</span><span class="font-medium">' + escapeHtml(r.name) + '</span>' +
        '<span class="text-ink-3">' + (r.admin1 ? escapeHtml(r.admin1) + ' · ' : '') + escapeHtml(r.country || '') + '</span>' +
        '</div>';
    }).join('');
    if(state.searchHighlight >= 0){
      searchInput.setAttribute('aria-activedescendant', 'search-opt-' + state.searchHighlight);
    }
    Array.prototype.forEach.call(searchDropdown.querySelectorAll('[role="option"]'), function(optEl){
      optEl.addEventListener('mousedown', function(e){
        e.preventDefault();
        var idx = parseInt(optEl.dataset.index, 10);
        chooseSearchResult(state.searchResults[idx]);
      });
    });
  }

  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // ---------------- Forecast rendering ----------------
  function renderForecast(daily){
    var container = document.getElementById('forecast-scroll');
    if(!daily || !daily.time){ container.innerHTML = '<p class="text-[13px] text-ink-3">–</p>'; return; }
    var maxes = daily.temperature_2m_max || [];
    var mins = daily.temperature_2m_min || [];
    var globalMax = Math.max.apply(null, maxes);
    var globalMin = Math.min.apply(null, mins);
    var range = (globalMax - globalMin) || 1;
    container.innerHTML = daily.time.map(function(dateStr, i){
      var d = new Date(dateStr + 'T00:00:00');
      var isToday = i === 0;
      var dayLabel = isToday ? '오늘' : WEEKDAY_KO[d.getUTCDay()] + '요일';
      var mdLabel = (d.getUTCMonth()+1) + '/' + d.getUTCDate();
      var code = (daily.weather_code || [])[i];
      var info = code !== undefined ? getWeatherInfo(code) : {emoji:'🌡️'};
      var maxT = maxes[i], minT = mins[i];
      var pop = (daily.precipitation_probability_max || [])[i];
      var topPct = maxT !== undefined ? ((globalMax - maxT) / range) * 100 : 0;
      var botPct = minT !== undefined ? ((globalMax - minT) / range) * 100 : 100;
      return '' +
      '<div class="forecast-card glass-l2 glass-scrim rounded-card px-2.5 py-3.5 flex flex-col items-center text-center">' +
        '<p class="text-[13px] font-semibold mb-0.5" style="color:' + (isToday ? '#FBBF24' : 'var(--ink-primary)') + '">' + dayLabel + '</p>' +
        '<p class="text-[12px] text-ink-3 mb-2">' + mdLabel + '</p>' +
        '<p class="text-[28px] mb-2 leading-none">' + info.emoji + '</p>' +
        '<div class="relative w-1 h-10 rounded-full mb-2" style="background:rgba(255,255,255,.14);">' +
          '<div class="absolute left-0 right-0 rounded-full" style="top:' + topPct + '%; height:' + Math.max(botPct - topPct, 8) + '%; background:linear-gradient(to top, #60A5FA, #FBBF24);"></div>' +
        '</div>' +
        '<p class="text-[16px] font-bold text-ink-1 leading-tight">' + (maxT !== undefined ? Math.round(maxT) + '°' : '–') + '</p>' +
        '<p class="text-[14px] text-ink-2 leading-tight">' + (minT !== undefined ? Math.round(minT) + '°' : '–') + '</p>' +
        (pop !== undefined && pop > 0 ? '<p class="text-[12px] mt-1" style="color:#60A5FA;">' + pop + '%</p>' : '') +
      '</div>';
    }).join('');
  }

  // ---------------- Main render ----------------
  function render(){
    // badges + dimming + selected ring
    state.landmarks.forEach(function(l){
      var gEl = document.querySelector('.landmark[data-id="' + l.id + '"]');
      var skel = document.querySelector('.badge-skeleton[data-id="' + l.id + '"]');
      var content = document.querySelector('.badge-content[data-id="' + l.id + '"]');
      if(state.phase === 'PREFETCHING'){
        skel.style.display = '';
        content.classList.remove('ready');
      } else if(l.weather){
        skel.style.display = 'none';
        var info = getWeatherInfo(l.weather.weather_code);
        content.querySelector('.badge-emoji').textContent = info.emoji;
        content.querySelector('.badge-temp').textContent = Math.round(l.weather.temperature_2m) + '°';
        content.classList.add('ready');
        gEl.setAttribute('aria-label', l.name + ', ' + l.city + ', 현재 ' + Math.round(l.weather.temperature_2m) + '도 ' + info.label);
      } else {
        skel.style.display = 'none';
        content.classList.remove('ready');
        gEl.setAttribute('aria-label', l.name + ', ' + l.city);
      }
      var visible = state.phase === 'SCENE_DEGRADED' ? true : isLandmarkVisible(l);
      gEl.classList.toggle('filtered-out', !visible);
      gEl.tabIndex = visible ? 0 : -1;
      var isSelected = !!(state.selected && !state.selected.isSearchResult && state.selected.id === l.id);
      gEl.classList.toggle('selected', isSelected);
    });

    // filter bar enabled/disabled
    var chipsDisabled = state.phase === 'SCENE_DEGRADED' || state.phase === 'PREFETCHING';
    Array.prototype.forEach.call(filterBarEl.querySelectorAll('.chip'), function(btn){
      btn.disabled = chipsDisabled;
      var active = state.filters[btn.dataset.axis].indexOf(btn.dataset.value) >= 0;
      btn.setAttribute('aria-pressed', String(active));
    });
    document.getElementById('degraded-banner').classList.toggle('hidden', state.phase !== 'SCENE_DEGRADED');

    var visibleCount = state.phase === 'SCENE_DEGRADED' ? 12 : state.landmarks.filter(isLandmarkVisible).length;
    document.getElementById('filter-counter').textContent = '12곳 중 ' + visibleCount + '곳';

    var activeFilterCount = state.filters.weather.length + state.filters.region.length + state.filters.daynight.length;
    var badgeEl = document.getElementById('filter-count-badge');
    if(activeFilterCount > 0){ badgeEl.textContent = activeFilterCount; badgeEl.classList.remove('hidden'); }
    else badgeEl.classList.add('hidden');

    var anyFilterActive = activeFilterCount > 0;
    document.getElementById('empty-filter-overlay').classList.toggle('hidden',
      !(state.phase === 'SCENE_READY' && anyFilterActive && visibleCount === 0));

    // filter bar visibility (mobile collapse)
    if(window.innerWidth < 768){
      filterBarEl.classList.toggle('hidden', !state.filterBarOpen);
    } else {
      filterBarEl.classList.remove('hidden');
    }

    // detail panel
    var skeletonEl = document.getElementById('panel-skeleton');
    var errorEl = document.getElementById('panel-error');
    var contentEl = document.getElementById('panel-content');
    skeletonEl.classList.add('hidden');
    errorEl.classList.add('hidden');
    contentEl.classList.add('hidden');

    if(state.selected){
      var sel = state.selected;
      document.getElementById('panel-title').textContent = sel.name;
      var subtitleParts = [];
      if(sel.isSearchResult){
        if(sel.admin1) subtitleParts.push(sel.admin1);
        if(sel.country) subtitleParts.push(sel.country);
      } else {
        subtitleParts.push(sel.city);
        subtitleParts.push(sel.country);
      }
      document.getElementById('panel-subtitle').textContent = subtitleParts.join(' · ');
    }

    if(state.phase === 'DETAIL_LOADING'){
      skeletonEl.classList.remove('hidden');
    } else if(state.phase === 'DETAIL_ERROR' && state.error){
      errorEl.classList.remove('hidden');
      document.getElementById('panel-error-message').textContent = state.error.message || '알 수 없는 오류가 발생했습니다';
    } else if(state.phase === 'DETAIL_READY' && state.detail){
      contentEl.classList.remove('hidden');
      var cur = state.detail.current || {};
      var info = cur.weather_code !== undefined ? getWeatherInfo(cur.weather_code) : {emoji:'🌡️', label:'정보 없음'};
      document.getElementById('panel-emoji').textContent = info.emoji;
      document.getElementById('panel-temp-value').textContent = (cur.temperature_2m !== undefined ? Math.round(cur.temperature_2m) : '–');
      document.getElementById('panel-weather-label').textContent = info.label;
      document.getElementById('panel-feels').textContent = cur.apparent_temperature !== undefined ? Math.round(cur.apparent_temperature) + '°C' : '–';
      document.getElementById('panel-humidity').textContent = cur.relative_humidity_2m !== undefined ? cur.relative_humidity_2m + '%' : '–';
      document.getElementById('panel-precip').textContent = cur.precipitation !== undefined ? cur.precipitation + 'mm' : '–';
      document.getElementById('panel-wind').textContent = cur.wind_speed_10m !== undefined ? Math.round(cur.wind_speed_10m) + 'km/h' : '–';
      renderForecast(state.detail.daily);
      updateClockDisplay();
    }

    applyBackground();
  }

  // ---------------- Prefetch flow ----------------
  function startPrefetch(){
    hasPrefetchError = false;
    state.phase = 'PREFETCHING';
    state.error = null;
    render();
    prefetchScene().then(function(arr){
      state.landmarks = state.landmarks.map(function(l, i){
        var entry = arr[i] || {};
        return Object.assign({}, l, {weather: entry.current || null});
      });
      state.phase = 'SCENE_READY';
      hasPrefetchError = false;
      render();
    }).catch(function(err){
      state.phase = 'SCENE_DEGRADED';
      state.error = err;
      hasPrefetchError = true;
      render();
    });
  }

  // ---------------- Init ----------------
  loadFiltersFromUrl();
  render();
  updateSceneLighting();
  lightingTimerId = setInterval(updateSceneLighting, 60 * 1000);
  window.addEventListener('resize', function(){
    render();
  });
  startPrefetch();

})();
</script>
</body>
</html>
