<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>World Weather Explorer</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  :root{
    --bg-from:#7ec8e3;
    --bg-to:#fff6b8;
    --landmark-fill:#24303d;
    --ground-fill:#1b2531;
    --mountain-fill:#3a4656;
  }
  html,body{ height:100%; }
  body{
    margin:0;
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: var(--bg-to);
    color:#0f172a;
  }
  body[data-text="light"] .on-bg{ color:#f8fafc; }
  body[data-text="dark"] .on-bg{ color:#0f172a; }
  body[data-text="light"] .on-bg-sub{ color:#e2e8f0; }
  body[data-text="dark"] .on-bg-sub{ color:#334155; }

  #bg-layer{
    position:fixed; inset:0; z-index:0;
    background-image: linear-gradient(180deg, var(--bg-from), var(--bg-to));
    transition: background-image .8s ease-in-out;
  }

  /* Scene */
  #scene-wrapper{ position:relative; }
  #scene-svg{ display:block; width:100%; height:auto; }
  .landmark{ cursor:pointer; outline:none; }
  .landmark .silhouette{ fill: var(--landmark-fill); transition: filter .2s ease, opacity .3s ease; }
  .landmark:hover .silhouette,
  .landmark:focus-visible .silhouette{ filter:brightness(1.4); }
  .landmark .hit-area{ fill:transparent; }
  .landmark .label{ opacity:0; transition:opacity .2s ease; fill:#fff; paint-order:stroke; stroke:#0f172a; stroke-width:4px; font-size:20px; font-weight:600; }
  .landmark:hover .label,
  .landmark:focus-visible .label{ opacity:1; }
  .landmark:focus-visible .focus-ring{ opacity:1; }
  .focus-ring{ opacity:0; fill:none; stroke:#fff; stroke-width:3; stroke-dasharray:4 3; }
  .landmark.filtered-out{ opacity:0.2; filter:grayscale(1); pointer-events:none; }
  .badge-content{ opacity:0; transition:opacity .3s ease; }
  .badge-content.ready{ opacity:1; }
  .badge-emoji{ font-size:26px; }
  .badge-temp{ font-size:20px; font-weight:700; fill:#fff; paint-order:stroke; stroke:#0f172a; stroke-width:4px; }
  .badge-skeleton rect{ fill:#94a3b8; }
  .skeleton-pulse{ animation: pulse 1.5s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.35; } 50%{ opacity:.8; } }

  #night-overlay{ fill:#050914; transition: opacity 1.2s ease-in-out; pointer-events:none; }

  @media (max-width: 767px){
    #scene-wrapper{ overflow-x:auto; scroll-snap-type:x proximity; -webkit-overflow-scrolling:touch; }
    #scene-svg{ width:1600px; max-width:none; }
    .landmark .label{ display:none; }
    .scroll-hint{ display:flex; }
  }
  @media (min-width: 768px){
    .scroll-hint{ display:none; }
  }

  /* Detail panel */
  #detail-panel{
    position:fixed; z-index:50; background:rgba(15,23,42,0.92); color:#f1f5f9;
    transition: transform .35s ease-in-out;
    backdrop-filter: blur(6px);
  }
  @media (min-width:768px){
    #detail-panel{ top:0; right:0; height:100%; width:440px; transform:translateX(100%); box-shadow:-8px 0 24px rgba(0,0,0,.25); }
    #detail-panel.open{ transform:translateX(0); }
  }
  @media (max-width:767px){
    #detail-panel{ left:0; right:0; bottom:0; height:85vh; border-radius:20px 20px 0 0; transform:translateY(100%); }
    #detail-panel.open{ transform:translateY(0); }
  }
  #panel-backdrop{ position:fixed; inset:0; z-index:40; background:rgba(0,0,0,.25); opacity:0; pointer-events:none; transition:opacity .3s ease; }
  #panel-backdrop.open{ opacity:1; pointer-events:auto; }

  .chip{ transition: background-color .15s ease, color .15s ease, opacity .15s ease; }
  .chip[aria-pressed="true"]{ background:#0f172a; color:#fff; }
  .chip:disabled{ opacity:.4; cursor:not-allowed; }

  .forecast-card{ scroll-snap-align:start; }
  #forecast-scroll{ scroll-snap-type:x proximity; }

  .skel-block{ background:rgba(255,255,255,.15); border-radius:8px; animation: pulse 1.5s ease-in-out infinite; }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001ms !important; animation-iteration-count:1 !important; transition-duration:.001ms !important; }
  }

  ::-webkit-scrollbar{ height:8px; width:8px; }
  ::-webkit-scrollbar-thumb{ background:rgba(148,163,184,.5); border-radius:4px; }
</style>
</head>
<body data-text="dark">

<div id="bg-layer" aria-hidden="true"></div>

<div id="app" class="relative z-10 min-h-screen flex flex-col">

  <!-- Header -->
  <header class="sticky top-0 z-30 px-4 py-3 md:px-6 md:py-4 backdrop-blur-sm bg-white/10">
    <div class="flex items-center gap-3 flex-wrap">
      <h1 class="on-bg text-lg md:text-xl font-bold whitespace-nowrap">World Weather Explorer</h1>

      <div class="relative flex-1 min-w-[180px] max-w-md">
        <input id="search-input" type="text" autocomplete="off"
          role="combobox" aria-expanded="false" aria-controls="search-dropdown" aria-autocomplete="list"
          placeholder="도시 검색 (예: 파리, Tokyo)"
          class="w-full rounded-full px-4 py-2 text-sm bg-white/90 text-slate-900 placeholder-slate-400 outline-none focus:ring-2 focus:ring-slate-900" />
        <div id="search-dropdown" role="listbox" aria-label="검색 결과"
          class="hidden absolute left-0 right-0 top-full mt-2 z-40 bg-white text-slate-900 rounded-xl shadow-xl overflow-hidden max-h-80 overflow-y-auto"></div>
      </div>

      <button id="filter-toggle-btn" class="md:hidden relative on-bg text-sm font-medium px-3 py-2 rounded-full bg-white/20">
        필터
        <span id="filter-count-badge" class="hidden absolute -top-1 -right-1 bg-rose-500 text-white text-[10px] rounded-full w-4 h-4 flex items-center justify-center"></span>
      </button>
    </div>
  </header>

  <!-- Filter bar -->
  <section id="filter-bar" class="z-20 px-4 md:px-6 py-3 bg-white/10 backdrop-blur-sm hidden md:block">
    <div class="flex flex-wrap items-center gap-x-6 gap-y-3">
      <div class="flex flex-wrap items-center gap-1.5" data-axis="weather" role="group" aria-label="날씨 상태 필터"></div>
      <div class="flex flex-wrap items-center gap-1.5" data-axis="region" role="group" aria-label="지역 필터"></div>
      <div class="flex flex-wrap items-center gap-1.5" data-axis="daynight" role="group" aria-label="낮/밤 필터"></div>
      <div class="flex items-center gap-3 ml-auto">
        <span id="filter-counter" class="on-bg text-sm font-medium whitespace-nowrap">12곳 중 12곳</span>
        <button id="clear-filters-btn" class="text-sm underline on-bg-sub whitespace-nowrap">전체 해제</button>
      </div>
    </div>
    <p id="degraded-banner" class="hidden mt-3 text-sm bg-rose-900/70 text-rose-50 rounded-lg px-3 py-2 flex items-center gap-3 flex-wrap">
      날씨 정보를 불러오지 못해 필터를 사용할 수 없습니다
      <button id="retry-prefetch-btn" class="underline font-medium">재시도</button>
    </p>
  </section>

  <!-- Main scene -->
  <main class="relative flex-1 flex items-center">
    <div id="scene-wrapper" class="w-full relative">
      <svg id="scene-svg" viewBox="0 0 1600 600" xmlns="http://www.w3.org/2000/svg" aria-label="세계 랜드마크 일러스트 씬">
        <!-- background mountains -->
        <path d="M0,480 L120,380 L260,460 L420,340 L600,470 L760,360 L940,450 L1120,370 L1300,460 L1440,390 L1600,470 L1600,600 L0,600 Z" fill="var(--mountain-fill)" opacity="0.35"></path>

        <g id="landmarks-layer"></g>

        <!-- foreground ground -->
        <path d="M0,520 Q400,505 800,520 T1600,520 L1600,600 L0,600 Z" fill="var(--ground-fill)"></path>

        <rect id="night-overlay" x="0" y="0" width="1600" height="600" opacity="0"></rect>
      </svg>

      <div class="scroll-hint pointer-events-none absolute right-0 top-0 bottom-0 w-16 items-center justify-end pr-2"
        style="background:linear-gradient(to right, transparent, rgba(0,0,0,.25));">
        <span class="text-white text-2xl">›</span>
      </div>

      <!-- empty filter overlay -->
      <div id="empty-filter-overlay" class="hidden absolute inset-0 z-20 flex items-center justify-center">
        <div class="bg-white/95 text-slate-900 rounded-2xl px-6 py-5 text-center shadow-xl">
          <p class="font-semibold mb-3">조건에 맞는 곳이 없습니다</p>
          <button id="empty-filter-reset-btn" class="px-4 py-2 rounded-full bg-slate-900 text-white text-sm">필터 초기화</button>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Detail panel backdrop -->
<div id="panel-backdrop"></div>

<!-- Detail panel -->
<aside id="detail-panel" role="dialog" aria-modal="true" aria-labelledby="panel-title" tabindex="-1">
  <div class="h-full flex flex-col p-5 overflow-y-auto">
    <div class="flex items-start justify-between mb-4">
      <div>
        <h2 id="panel-title" class="text-xl font-bold"></h2>
        <p id="panel-subtitle" class="text-sm text-slate-300"></p>
      </div>
      <button id="panel-close-btn" aria-label="닫기" class="text-2xl leading-none px-2 py-1 rounded hover:bg-white/10">×</button>
    </div>

    <!-- loading skeleton -->
    <div id="panel-skeleton" class="hidden space-y-4">
      <div class="skel-block h-16 w-full"></div>
      <div class="skel-block h-24 w-full"></div>
      <div class="skel-block h-28 w-full"></div>
    </div>

    <!-- error -->
    <div id="panel-error" class="hidden">
      <p id="panel-error-message" class="text-sm mb-3"></p>
      <div class="flex gap-2">
        <button id="panel-retry-btn" class="px-3 py-1.5 rounded-full bg-white text-slate-900 text-sm font-medium">재시도</button>
        <button id="panel-error-close-btn" class="px-3 py-1.5 rounded-full bg-white/10 text-sm">닫기</button>
      </div>
    </div>

    <!-- content -->
    <div id="panel-content" class="hidden flex-1 flex flex-col">
      <div class="mb-4">
        <p id="panel-time" class="text-2xl font-semibold tabular-nums"></p>
        <p id="panel-date" class="text-sm text-slate-300"></p>
      </div>

      <div class="flex items-center gap-4 mb-4">
        <span id="panel-emoji" class="text-5xl"></span>
        <div>
          <p id="panel-temp" class="text-4xl font-bold tabular-nums"></p>
          <p id="panel-weather-label" class="text-sm text-slate-300"></p>
        </div>
      </div>

      <div class="grid grid-cols-2 gap-2 mb-6 text-sm">
        <div class="bg-white/10 rounded-lg px-3 py-2"><span class="text-slate-400 block">체감</span><span id="panel-feels" class="font-medium"></span></div>
        <div class="bg-white/10 rounded-lg px-3 py-2"><span class="text-slate-400 block">습도</span><span id="panel-humidity" class="font-medium"></span></div>
        <div class="bg-white/10 rounded-lg px-3 py-2"><span class="text-slate-400 block">강수</span><span id="panel-precip" class="font-medium"></span></div>
        <div class="bg-white/10 rounded-lg px-3 py-2"><span class="text-slate-400 block">풍속</span><span id="panel-wind" class="font-medium"></span></div>
      </div>

      <h3 class="text-sm font-semibold text-slate-300 mb-2">7일 예보</h3>
      <div id="forecast-scroll" class="flex gap-2 overflow-x-auto pb-2"></div>
    </div>
  </div>
</aside>

<script>
(function(){
  "use strict";

  var TIMEOUT_MS = 8000;
  var PREFETCH_TTL_MS = 10*60*1000;
  var DETAIL_TTL_MS = 10*60*1000;
  var PREFETCH_CACHE_KEY = 'wwe_prefetch_v1';

  var LANDMARKS = [
    { id:'liberty',   name:'자유의 여신상', city:'뉴욕',         country:'미국',     region:'북미',       lat: 40.6892, lon: -74.0445 },
    { id:'canyon',    name:'그랜드캐니언',  city:'애리조나',     country:'미국',     region:'북미',       lat: 36.1069, lon:-112.1129 },
    { id:'machu',     name:'마추픽추',      city:'쿠스코',       country:'페루',     region:'남미',       lat:-13.1631, lon: -72.5450 },
    { id:'christ',    name:'예수상',        city:'리우데자네이루',country:'브라질',   region:'남미',       lat:-22.9519, lon: -43.2105 },
    { id:'bigben',    name:'빅벤',          city:'런던',         country:'영국',     region:'유럽',       lat: 51.5007, lon:  -0.1246 },
    { id:'eiffel',    name:'에펠탑',        city:'파리',         country:'프랑스',   region:'유럽',       lat: 48.8584, lon:   2.2945 },
    { id:'colosseo',  name:'콜로세움',      city:'로마',         country:'이탈리아', region:'유럽',       lat: 41.8902, lon:  12.4922 },
    { id:'pyramid',   name:'기자 피라미드', city:'카이로',       country:'이집트',   region:'아프리카',   lat: 29.9792, lon:  31.1342 },
    { id:'taj',       name:'타지마할',      city:'아그라',       country:'인도',     region:'아시아',     lat: 27.1751, lon:  78.0421 },
    { id:'gyeongbok', name:'경복궁',        city:'서울',         country:'대한민국', region:'아시아',     lat: 37.5796, lon: 126.9770 },
    { id:'fuji',      name:'후지산',        city:'시즈오카',     country:'일본',     region:'아시아',     lat: 35.3606, lon: 138.7274 },
    { id:'opera',     name:'오페라하우스',  city:'시드니',       country:'호주',     region:'오세아니아', lat:-33.8568, lon: 151.2153 }
  ];

  var WEATHER_CODES = {
    0:{emoji:'☀️',label:'맑음',group:'clear'},
    1:{emoji:'🌤️',label:'대체로 맑음',group:'clear'},
    2:{emoji:'⛅',label:'구름 조금',group:'cloudy'},
    3:{emoji:'☁️',label:'흐림',group:'cloudy'},
    45:{emoji:'🌫️',label:'안개',group:'fog'},
    48:{emoji:'🌫️',label:'서리 안개',group:'fog'},
    51:{emoji:'🌦️',label:'약한 이슬비',group:'rain'},
    53:{emoji:'🌦️',label:'보통 이슬비',group:'rain'},
    55:{emoji:'🌦️',label:'강한 이슬비',group:'rain'},
    56:{emoji:'🌧️',label:'어는 이슬비',group:'rain'},
    57:{emoji:'🌧️',label:'어는 이슬비',group:'rain'},
    61:{emoji:'🌧️',label:'약한 비',group:'rain'},
    63:{emoji:'🌧️',label:'비',group:'rain'},
    65:{emoji:'🌧️',label:'강한 비',group:'rain'},
    66:{emoji:'🌧️',label:'어는 비',group:'rain'},
    67:{emoji:'🌧️',label:'어는 비',group:'rain'},
    71:{emoji:'🌨️',label:'약한 눈',group:'snow'},
    73:{emoji:'🌨️',label:'눈',group:'snow'},
    75:{emoji:'🌨️',label:'강한 눈',group:'snow'},
    77:{emoji:'🌨️',label:'싸락눈',group:'snow'},
    80:{emoji:'🌧️',label:'소나기',group:'rain'},
    81:{emoji:'🌧️',label:'강한 소나기',group:'rain'},
    82:{emoji:'🌧️',label:'폭우',group:'rain'},
    85:{emoji:'❄️',label:'소낙눈',group:'snow'},
    86:{emoji:'❄️',label:'소낙눈',group:'snow'},
    95:{emoji:'⛈️',label:'뇌우',group:'storm'},
    96:{emoji:'⛈️',label:'우박 동반 뇌우',group:'storm'},
    99:{emoji:'⛈️',label:'우박 동반 뇌우',group:'storm'}
  };
  function getWeatherInfo(code){ return WEATHER_CODES[code] || {emoji:'🌡️', label:'정보 없음', group:'unknown'}; }

  var BG_THEMES = {
    clear:  { day:{from:'#7ec8e3', to:'#fff6b8', text:'dark'},  night:{from:'#16215c', to:'#04040c', text:'light'} },
    cloudy: { day:{from:'#8b9bab', to:'#cdd8e3', text:'dark'},  night:{from:'#3a3f4b', to:'#101217', text:'light'} },
    fog:    { day:{from:'#cfd3d4', to:'#ececeb', text:'dark'},  night:{from:'#4a4d4f', to:'#1e2022', text:'light'} },
    rain:   { day:{from:'#5f7a8c', to:'#24384f', text:'light'}, night:{from:'#101a2e', to:'#04070d', text:'light'} },
    snow:   { day:{from:'#e6e9ec', to:'#ffffff', text:'dark'},  night:{from:'#5b6b7f', to:'#1c2436', text:'light'} },
    storm:  { day:{from:'#4a3b63', to:'#0d0d12', text:'light'}, night:{from:'#0d0d12', to:'#2c2044', text:'light'} }
  };

  var REGION_CODE = { '아시아':'asia', '유럽':'europe', '북미':'namerica', '남미':'samerica', '아프리카':'africa', '오세아니아':'oceania' };
  var CODE_REGION = { asia:'아시아', europe:'유럽', namerica:'북미', samerica:'남미', africa:'아프리카', oceania:'오세아니아' };
  var WEATHER_AXIS_OPTIONS = [
    {value:'clear', label:'맑음', emoji:'☀️'},
    {value:'cloudy', label:'흐림', emoji:'☁️'},
    {value:'rain', label:'비', emoji:'🌧️'},
    {value:'snow', label:'눈', emoji:'🌨️'},
    {value:'storm', label:'뇌우', emoji:'⛈️'},
    {value:'fog', label:'안개', emoji:'🌫️'}
  ];
  var REGION_AXIS_OPTIONS = ['아시아','유럽','북미','남미','아프리카','오세아니아'];
  var DAYNIGHT_AXIS_OPTIONS = [ {value:'day', label:'낮', emoji:'☀️'}, {value:'night', label:'밤', emoji:'🌙'} ];

  var WEEKDAY_KO = ['일','월','화','수','목','금','토'];

  // ---------------- State ----------------
  var state = {
    phase: 'PREFETCHING',
    landmarks: LANDMARKS.map(function(l){ return Object.assign({}, l, {weather:null}); }),
    filters: { weather:[], region:[], daynight:[] },
    selected: null,
    detail: null,
    error: null,
    filterBarOpen: window.innerWidth >= 768,
    searchResults: [],
    searchQuery: '',
    searchHighlight: -1,
    searchPhase: 'idle' // idle | loading | results | empty
  };

  var forecastCache = new Map();
  var clockTimerId = null;
  var lightingTimerId = null;
  var lastFocusedTrigger = null;
  var searchDebounceId = null;
  var searchAbortController = null;
  var detailAbortController = null;

  // ---------------- Fetch helpers ----------------
  function fetchJSON(url, opts){
    opts = opts || {};
    return new Promise(function(resolve, reject){
      if(!navigator.onLine){
        reject({kind:'offline', message:'인터넷 연결을 확인해주세요'});
        return;
      }
      var controller = new AbortController();
      var timeoutId = setTimeout(function(){ controller.abort(); }, TIMEOUT_MS);
      if(opts.signal){
        if(opts.signal.aborted) controller.abort();
        else opts.signal.addEventListener('abort', function(){ controller.abort(); });
      }
      fetch(url, {signal: controller.signal}).then(function(res){
        clearTimeout(timeoutId);
        if(res.status === 429){ reject({kind:'rate_limit', message:'요청이 많습니다. 잠시 후 다시 시도해주세요'}); return; }
        if(res.status >= 500){ reject({kind:'server', message:'날씨 정보를 불러오지 못했습니다'}); return; }
        if(!res.ok){ reject({kind:'unknown', message:'알 수 없는 오류가 발생했습니다'}); return; }
        res.json().then(resolve).catch(function(){
          reject({kind:'parse', message:'알 수 없는 오류가 발생했습니다'});
        });
      }).catch(function(err){
        clearTimeout(timeoutId);
        if(err && err.name === 'AbortError'){
          reject({kind:'timeout', message:'날씨 정보를 불러오지 못했습니다'});
        } else {
          reject({kind:'unknown', message:'알 수 없는 오류가 발생했습니다'});
        }
      });
    });
  }

  function geocode(query, signal){
    var url = 'https://geocoding-api.open-meteo.com/v1/search?name=' + encodeURIComponent(query) + '&count=6&language=ko&format=json';
    return fetchJSON(url, {signal: signal}).then(function(data){
      return data.results || [];
    });
  }

  function prefetchScene(){
    try{
      var cached = sessionStorage.getItem(PREFETCH_CACHE_KEY);
      if(cached){
        var parsed = JSON.parse(cached);
        if(Date.now() - parsed.ts < PREFETCH_TTL_MS){
          return Promise.resolve(parsed.data);
        }
      }
    }catch(e){}
    var lats = LANDMARKS.map(function(l){ return l.lat; }).join(',');
    var lons = LANDMARKS.map(function(l){ return l.lon; }).join(',');
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lats + '&longitude=' + lons +
      '&current=temperature_2m,weather_code,is_day&timezone=auto';
    return fetchJSON(url).then(function(data){
      var arr = Array.isArray(data) ? data : [data];
      try{ sessionStorage.setItem(PREFETCH_CACHE_KEY, JSON.stringify({ts:Date.now(), data:arr})); }catch(e){}
      return arr;
    });
  }

  function fetchForecast(lat, lon, signal){
    var key = lat.toFixed(4) + ',' + lon.toFixed(4);
    var cached = forecastCache.get(key);
    if(cached && Date.now() - cached.ts < DETAIL_TTL_MS){
      return Promise.resolve(cached.data);
    }
    var url = 'https://api.open-meteo.com/v1/forecast?latitude=' + lat + '&longitude=' + lon +
      '&current=temperature_2m,apparent_temperature,relative_humidity_2m,is_day,precipitation,weather_code,wind_speed_10m' +
      '&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max' +
      '&timezone=auto&forecast_days=7';
    return fetchJSON(url, {signal: signal}).then(function(data){
      forecastCache.set(key, {ts:Date.now(), data:data});
      return data;
    });
  }

  // ---------------- URL sync ----------------
  function syncUrl(){
    var parts = [];
    if(state.filters.weather.length) parts.push('w=' + state.filters.weather.join(','));
    if(state.filters.region.length) parts.push('r=' + state.filters.region.map(function(r){ return REGION_CODE[r]; }).join(','));
    if(state.filters.daynight.length) parts.push('d=' + state.filters.daynight.join(','));
    var qs = parts.length ? '?' + parts.join('&') : '';
    history.replaceState(null, '', window.location.pathname + qs);
  }
  function loadFiltersFromUrl(){
    var params = new URLSearchParams(window.location.search);
    var w = params.get('w'), r = params.get('r'), d = params.get('d');
    var validW = WEATHER_AXIS_OPTIONS.map(function(o){ return o.value; });
    if(w) state.filters.weather = w.split(',').filter(function(v){ return validW.indexOf(v) >= 0; });
    if(r) state.filters.region = r.split(',').map(function(c){ return CODE_REGION[c]; }).filter(Boolean);
    if(d) state.filters.daynight = d.split(',').filter(function(v){ return v === 'day' || v === 'night'; });

    var info = getWeatherInfo(l.weather.weather_code);

    var f = state.filters;
    if(f.weather.length && f.weather.indexOf(info.group) < 0) return false;
    if(f.region.length && f.region.indexOf(l.region) < 0) return false;
    if(f.daynight.length && f.daynight.indexOf(dn) < 0) return false;
    return true;
  }

    if(e.key === 'ArrowRight' || e.key === 'ArrowLeft'){

      if(!items.length) return;
      var idx = items.indexOf(current);
      var next;
      if(idx === -1) next = items[0];
      else next = e.key === 'ArrowRight' ? items[(idx+1) % items.length] : items[(idx-1+items.length) % items.length];
      next.focus();
      return;
    }
    if((e.key === 'Enter' || e.key === ' ') && current && !current.classList.contains('filtered-out')){
      e.preventDefault();
      lastFocusedTrigger = current;
      activateLandmarkById(current.dataset.id);

      if(!focusables.length) return;
      var first = focusables[0], last = focusables[focusables.length - 1];
      if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
      else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
    }

  searchInput.addEventListener('input', function(){

      state.searchResults = [];

    state.searchPhase = 'loading';

      searchAbortController = new AbortController();

        state.searchResults = results;
        state.searchPhase = results.length ? 'results' : 'empty';

        state.searchResults = [];
        state.searchPhase = 'empty';
        renderSearchDropdown();
      });

  searchInput.addEventListener('keydown', function(e){

    var n = state.searchResults.length;
    if(e.key === 'ArrowDown'){ e.preventDefault(); state.searchHighlight = (state.searchHighlight + 1) % n; renderSearchDropdown(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); state.searchHighlight = (state.searchHighlight - 1 + n) % n; renderSearchDropdown(); }
    else if(e.key === 'Enter'){
      if(state.searchHighlight >= 0 && state.searchResults[state.searchHighlight]){
        e.preventDefault();

  // ---------------- Forecast rendering ----------------
  function renderForecast(daily){
    var container = document.getElementById('forecast-scroll');
    if(!daily || !daily.time){ container.innerHTML = '<p class="text-sm text-slate-400">–</p>'; return; }
    var maxes = daily.temperature_2m_max || [];
    var mins = daily.temperature_2m_min || [];
    var globalMax = Math.max.apply(null, maxes);
    var globalMin = Math.min.apply(null, mins);
    var range = (globalMax - globalMin) || 1;
    container.innerHTML = daily.time.map(function(dateStr, i){
      var d = new Date(dateStr + 'T00:00:00');
      var dayLabel = i === 0 ? '오늘' : WEEKDAY_KO[d.getUTCDay()] + '요일';
      var mdLabel = (d.getUTCMonth()+1) + '/' + d.getUTCDate();
      var code = (daily.weather_code || [])[i];
      var info = code !== undefined ? getWeatherInfo(code) : {emoji:'🌡️', label:'정보 없음'};
      var maxT = maxes[i], minT = mins[i];
      var pop = (daily.precipitation_probability_max || [])[i];
      var topPct = maxT !== undefined ? ((globalMax - maxT) / range) * 100 : 0;
      var botPct = minT !== undefined ? ((globalMax - minT) / range) * 100 : 100;
      return '' +
      '<div class="forecast-card flex-shrink-0 w-[86px] bg-white/10 rounded-xl px-2 py-3 text-center">' +
        '<p class="text-xs text-slate-300 mb-0.5">' + dayLabel + '</p>' +
        '<p class="text-[11px] text-slate-400 mb-2">' + mdLabel + '</p>' +
        '<p class="text-xl mb-2">' + info.emoji + '</p>' +
        '<div class="relative h-14 w-3 mx-auto bg-white/10 rounded-full mb-2">' +
          '<div class="absolute left-0 right-0 rounded-full bg-amber-300" style="top:' + topPct + '%; height:' + Math.max(botPct - topPct, 6) + '%;"></div>' +
        '</div>' +
        '<p class="text-xs font-semibold">' + (maxT !== undefined ? Math.round(maxT) + '°' : '–') + '</p>' +
        '<p class="text-xs text-slate-400">' + (minT !== undefined ? Math.round(minT) + '°' : '–') + '</p>' +
        '<p class="text-[11px] text-sky-300 mt-1">' + (pop !== undefined ? pop + '%' : '–') + '</p>' +
      '</div>';
    }).join('');
  }

  // ---------------- Main render ----------------
  var hasPrefetchError = false;

  function render(){
    // badges + dimming
    state.landmarks.forEach(function(l){
      var gEl = document.querySelector('.landmark[data-id="' + l.id + '"]');
      var skel = document.querySelector('.badge-skeleton[data-id="' + l.id + '"]');
      var content = document.querySelector('.badge-content[data-id="' + l.id + '"]');
      if(state.phase === 'PREFETCHING'){
        skel.style.display = '';
        content.classList.remove('ready');
      } else if(l.weather){
        skel.style.display = 'none';
        var info = getWeatherInfo(l.weather.weather_code);
        content.querySelector('.badge-emoji').textContent = info.emoji;
        content.querySelector('.badge-temp').textContent = Math.round(l.weather.temperature_2m) + '°';
        content.classList.add('ready');
        gEl.setAttribute('aria-label', l.name + ', ' + l.city + ', 현재 ' + Math.round(l.weather.temperature_2m) + '도 ' + info.label);
      } else {
        skel.style.display = 'none';
        content.classList.remove('ready');
        gEl.setAttribute('aria-label', l.name + ', ' + l.city);
      }
      var visible = state.phase === 'SCENE_DEGRADED' ? true : isLandmarkVisible(l);
      gEl.classList.toggle('filtered-out', !visible);
      gEl.tabIndex = visible ? 0 : -1;
    });

    // filter bar enabled/disabled
    var chipsDisabled = state.phase === 'SCENE_DEGRADED' || state.phase === 'PREFETCHING';
    Array.prototype.forEach.call(filterBarEl.querySelectorAll('.chip'), function(btn){
      btn.disabled = chipsDisabled;
      var active = state.filters[btn.dataset.axis].indexOf(btn.dataset.value) >= 0;
      btn.setAttribute('aria-pressed', String(active));
    });
    document.getElementById('degraded-banner').classList.toggle('hidden', state.phase !== 'SCENE_DEGRADED');

    var visibleCount = state.phase === 'SCENE_DEGRADED' ? 12 : state.landmarks.filter(isLandmarkVisible).length;
    document.getElementById('filter-counter').textContent = '12곳 중 ' + visibleCount + '곳';

    var activeFilterCount = state.filters.weather.length + state.filters.region.length + state.filters.daynight.length;
    var badgeEl = document.getElementById('filter-count-badge');
    if(activeFilterCount > 0){ badgeEl.textContent = activeFilterCount; badgeEl.classList.remove('hidden'); }
    else badgeEl.classList.add('hidden');

    var anyFilterActive = activeFilterCount > 0;
    document.getElementById('empty-filter-overlay').classList.toggle('hidden',
      !(state.phase === 'SCENE_READY' && anyFilterActive && visibleCount === 0));

    // filter bar visibility (mobile collapse)
    if(window.innerWidth < 768){
      filterBarEl.classList.toggle('hidden', !state.filterBarOpen);
    } else {
      filterBarEl.classList.remove('hidden');
    }

    // detail panel
    var skeletonEl = document.getElementById('panel-skeleton');
    var errorEl = document.getElementById('panel-error');
    var contentEl = document.getElementById('panel-content');
    skeletonEl.classList.add('hidden');
    errorEl.classList.add('hidden');
    contentEl.classList.add('hidden');

    if(state.selected){
      var sel = state.selected;
      document.getElementById('panel-title').textContent = sel.name;
      var subtitleParts = [];
      if(sel.isSearchResult){
        if(sel.admin1) subtitleParts.push(sel.admin1);
        if(sel.country) subtitleParts.push(sel.country);
      } else {
        subtitleParts.push(sel.city);
        subtitleParts.push(sel.country);
      }
      document.getElementById('panel-subtitle').textContent = subtitleParts.join(' · ');
    }

    if(state.phase === 'DETAIL_LOADING'){
      skeletonEl.classList.remove('hidden');
    } else if(state.phase === 'DETAIL_ERROR' && state.error){
      errorEl.classList.remove('hidden');
      document.getElementById('panel-error-message').textContent = state.error.message || '알 수 없는 오류가 발생했습니다';
    } else if(state.phase === 'DETAIL_READY' && state.detail){
      contentEl.classList.remove('hidden');
      var cur = state.detail.current || {};
      var info = cur.weather_code !== undefined ? getWeatherInfo(cur.weather_code) : {emoji:'🌡️', label:'정보 없음'};
      document.getElementById('panel-emoji').textContent = info.emoji;
      document.getElementById('panel-temp').textContent = (cur.temperature_2m !== undefined ? Math.round(cur.temperature_2m) + '°C' : '–');
      document.getElementById('panel-weather-label').textContent = info.label;
      document.getElementById('panel-feels').textContent = cur.apparent_temperature !== undefined ? Math.round(cur.apparent_temperature) + '°C' : '–';
      document.getElementById('panel-humidity').textContent = cur.relative_humidity_2m !== undefined ? cur.relative_humidity_2m + '%' : '–';
      document.getElementById('panel-precip').textContent = cur.precipitation !== undefined ? cur.precipitation + 'mm' : '–';
      document.getElementById('panel-wind').textContent = cur.wind_speed_10m !== undefined ? Math.round(cur.wind_speed_10m) + 'km/h' : '–';
      renderForecast(state.detail.daily);
      updateClockDisplay();
    }

    applyBackground();
  }

  // ---------------- Prefetch flow ----------------
  function startPrefetch(){
    hasPrefetchError = false;
    state.phase = 'PREFETCHING';
    state.error = null;
    render();
    prefetchScene().then(function(arr){
      state.landmarks = state.landmarks.map(function(l, i){
        var entry = arr[i] || {};
        return Object.assign({}, l, {weather: entry.current || null});
      });
      state.phase = 'SCENE_READY';
      hasPrefetchError = false;
      render();
    }).catch(function(err){
      state.phase = 'SCENE_DEGRADED';
      state.error = err;
      hasPrefetchError = true;
      render();
    });
  }

  // ---------------- Init ----------------
  loadFiltersFromUrl();
  render();
  updateSceneLighting();
  lightingTimerId = setInterval(updateSceneLighting, 60 * 1000);
  window.addEventListener('resize', function(){
    render();
  });
  startPrefetch();

})();
</script>
</body>
</html>
